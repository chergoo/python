<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UviLUX 传感器上位机</title>
    <script src="echarts.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 传感器信息面板 -->
    <div class="info-panel">
        <span class="info-item"><strong>序列号:</strong> <span id="serial">-</span></span>
        <span class="info-item"><strong>仪器类型:</strong> <span id="instype">-</span></span>
        <span class="info-item"><strong>固件版本:</strong> <span id="firmware">-</span></span>
    </div>

    <!-- 中部：EHT + 模式 + 图表 -->
    <div class="main-area">
        <!-- 左侧面板 -->
        <div class="left-panel">
            <div class="section">
                <div class="section-title">EHT 校准系数</div>
                <table id="eht-table">
                    <thead><tr><th>EHT</th><th>系数 A</th><th>系数 B</th><th>系数 C</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="section mode-section">
                <div class="section-title">测量模式</div>
                <div class="mode-label">Gain</div>
                <div class="mode-value" id="mode-val">-</div>
                <hr>
                <div class="mode-label">当前测量值</div>
                <div class="cur-value" id="cur-val">-.---</div>
            </div>
        </div>
        <div class="chart-panel">
            <div class="section-title">实时测量数据</div>
            <div id="chart-container">
                <div id="chart-placeholder" style="display:flex;align-items:center;justify-content:center;height:100%;color:#999;font-size:14px;">
                    等待数据...
                </div>
            </div>
        </div>
    </div>

    <!-- 控制栏 -->
    <div class="control-bar">
        <label>串口:</label>
        <select id="port-select"><option value="">-- 选择串口 --</option></select>
        <label>波特率:</label>
        <select id="baud-select">
            <option>9600</option><option>19200</option><option>38400</option>
            <option>57600</option><option selected>115200</option><option>230400</option>
        </select>
        <button id="btn-connect" onclick="toggleConnect()">● 连接</button>
        <button onclick="replayFile()">📁 文件回放</button>
        <button onclick="refreshPorts()">刷新</button>
        <button onclick="clearAll()">清空图表</button>
    </div>

    <div class="status-bar">
        <span>状态: <span id="status-text">初始化中...</span></span>
        <span>数据: <span id="count-text">0</span> 条</span>
        <span>最后更新: <span id="last-text">-</span></span>
        <span>日志: <span id="log-text">-</span></span>
        <button id="btn-debug" onclick="toggleDebug()" style="margin-left:auto;padding:1px 8px;font-size:11px;cursor:pointer;">调试</button>
    </div>

    <!-- 调试日志面板 -->
    <div id="debug-panel" style="display:none;flex-shrink:0;border-top:2px solid #d93025;background:#1e1e1e;">
        <div style="display:flex;justify-content:space-between;padding:2px 8px;background:#333;color:#ccc;font-size:11px;">
            <span>调试日志</span>
            <button onclick="clearDebugLog()" style="background:none;border:1px solid #666;color:#ccc;cursor:pointer;font-size:10px;">清空</button>
        </div>
        <div id="debug-log" style="height:140px;overflow-y:auto;padding:4px 8px;font-family:Consolas,monospace;font-size:11px;color:#0f0;white-space:pre-wrap;word-break:break-all;"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
